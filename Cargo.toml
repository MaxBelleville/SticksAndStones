[package]
name = "sticks_and_stones"
version = "0.1.0"
edition = "2024"
# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1


# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = { version = "0.17.3", features = ["bevy_render", "dynamic_linking", "bevy_pbr"] }
bevy_aseprite_ultra = "0.7.0"
bevy_lunex = { git = "https://github.com/bytestring-net/bevy_lunex" }
bevy_skein = "0.4.0"
bytemuck = "1.23.1"
iyes_progress = "0.15.0"
leafwing-input-manager = "0.19.0"
moonshine-core = "0.5.0"
nonmax = "0.5.5"
simdnoise = "3.1.6"
twox-hash = "2.1.1"
