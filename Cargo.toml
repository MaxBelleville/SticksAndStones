[package]
name = "sticks_and_stones"
version = "0.1.0"
edition = "2024"
# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
codegen-units = 1
lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[workspace]
resolver = "2"
members = ["crates/*"]


[workspace.dependencies]
ron = "0.12.3"
bevy_log = { version = "0.20.1" }
bevy_math = {version="0.20.1", features = ["serialize"]}
bytemuck = "1.25.2"
smallvec = "1.16.4"
serde = {version="1", features = ["derive"]}
nonmax = "0.5.5"


[dependencies]
bevy = { version = "0.20.1",default-features =true, features = [
    "bevy_render",
    "dynamic_linking",
    "bevy_feathers",
    "bevy_pbr",
    "bevy_picking",
]}

iyes_progress = "0.18"
leafwing-input-manager = "0.22"
moonshine-core = "0.7.0"
moonshine-behavior = "0.6.0"
bevy_skein = "0.7.0"
bevy_console = "0.19.0"
bitflags = {version = "2.13.2", features = ["bytemuck","serde"]}
nonmax =  {workspace = true}
bytemuck = {workspace = true}

bevy_stdb = {git = "https://github.com/onx2/bevy_stdb.git"}
sns_asset_manager = {git = "https://github.com/MaxBelleville/sns_asset_manager.git"}
spacetimedb-sdk = "2.14.1"
