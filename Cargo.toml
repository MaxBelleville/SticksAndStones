[package]
name = "sticks_and_stones"
version = "0.1.0"
edition = "2024"
# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1


# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

[dependencies]
bevy = { version = "0.16.1", features = ["bevy_render", "dynamic_linking"] }
bevy_atmosphere = "=0.13.0"
bevy_enhanced_input = "0.14.1"

bytemuck = "1.23.1"
noisy_bevy = "0.10.1"
rand_core = "0.9.3"
bevy_rand = { version = "0.11.1", features = ["rand_chacha", "wyrand"] }
twox-hash = "2.1.1"
