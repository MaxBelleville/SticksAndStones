[package]
name = "sticks_and_stones"
version = "0.1.0"
edition = "2024"
# Enable a small amount of optimization in the dev profile.
[profile.dev]
opt-level = 1

# Enable a large amount of optimization in the dev profile for dependencies.
[profile.dev.package."*"]
opt-level = 3

# Enable more optimization in the release profile at the cost of compile time.
[profile.release]
codegen-units = 1
lto = "thin"

# Optimize for size in the wasm-release profile to reduce load times and bandwidth usage on web.
[profile.wasm-release]
inherits = "release"
opt-level = "s"
strip = "debuginfo"

[workspace]
resolver = "2"
members = ["crates/*"]


[workspace.dependencies]
bevy_log = {version = "0.18.1"}
bevy_math = {version="0.18.1", features = ["serialize"]}
bytemuck = "1.24.0"
smallvec = "1.15.1"
serde = {version="1.0.228", features = ["derive"]}
bitflags = {version = "2.10.0", features = ["bytemuck","serde"]}
serde_json = "1.0.149"
jsonschema = "0.45.0"
nonmax = "0.5.5"
num-traits = "0.2.19"


[dependencies]
bevy = { version = "0.18.1",default-features =true, features = [
    "bevy_render",
    "dynamic_linking",
    "bevy_pbr",
    "bevy_picking",
]}
bevy_aseprite_ultra = "0.8.1"
iyes_progress = "0.16"
leafwing-input-manager = "0.20.0"
moonshine-core = "0.5.1"
moonshine-behavior = "0.4.1"
bevy_skein = "0.5.0"
bevy_console = "0.17.1"
bitflags = {workspace = true}
nonmax =  {workspace = true}
bytemuck = {workspace = true}

sns_core = { path = "crates/sns_core" }
sns_world = { path = "crates/sns_world" }
sns_assets = { path = "crates/sns_assets" }
bevy_stdb = {git = "https://github.com/onx2/bevy_stdb.git"}
spacetimedb-sdk = "2.1.0"
